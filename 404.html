  window.__countdown = () => {
    for (const root of document.querySelectorAll('[data-countdown]:not([data-live])')) {
      root.dataset.live = '';
      const label = root.querySelector('[data-countdown-label]');
      const value = root.querySelector('[data-countdown-value]');
      const opening = Number(root.dataset.opening);
      const closing = Number(root.dataset.closing);

      const plural = new Intl.PluralRules('ru');
      const units = [
        [86400, { one: 'день', few: 'дня', many: 'дней' }],
        [3600, { one: 'час', few: 'часа', many: 'часов' }],
        [60, { one: 'минута', few: 'минуты', many: 'минут' }],
        [1, { one: 'секунда', few: 'секунды', many: 'секунд' }],
      ];
      // Всегда четыре единицы, как в макете; между числом и словом — U+00A0. Вверх до секунды: в последнюю секунду —
      // «1 секунда», в момент открытия — уже следующее состояние, а не нули.
      const duration = (ms) => {
        let rest = Math.ceil(ms / 1000);
        return units
          .map(([size, forms]) => {
            const n = Math.floor(rest / size);
            rest -= n * size;
            return `${n}\u00A0${forms[plural.select(n)] ?? forms.many}`;
          })
          .join(' ');
      };
      const state = (now) =>
        now < opening
          ? ['до выставки', duration(opening - now), true]
          : now < closing
            ? ['до закрытия', duration(closing - now), true]
            : ['выставка', 'завершилась', false];

      let timer = 0;
      let onScreen = false;
      const render = () => {
        const [l, v, live] = state(Date.now());
        if (label.textContent !== l) label.textContent = l;
        if (value.textContent !== v) value.textContent = v;
        return live;
      };
      // Следующий тик — ровно на границе секунды системных часов (моменты кратны секунде): отсчёт не дрейфует.
      // Вне экрана и на скрытой вкладке не тикает; при возвращении — сразу верное значение.
      const tick = () => {
        clearTimeout(timer);
        if (!root.isConnected) return document.removeEventListener('visibilitychange', tick);
        if (render() && onScreen && !document.hidden) timer = setTimeout(tick, 1000 - (Date.now() % 1000));
      };

      render();
      new IntersectionObserver(([entry]) => {
        onScreen = entry.isIntersecting;
        tick();
      }).observe(root);
      document.addEventListener('visibilitychange', tick);
    }
  };
  window.__countdown();
